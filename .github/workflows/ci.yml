name: CI

on:
  push:
    branches:
      - main
      - issue-* 
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test-node:
    name: Node ${{ matrix.node }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18.x, 20.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Remote mode smoke check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node bin/gh-tree.mjs --repo link-foundation/gh-tree@main --depth 1 --no-count --json > /dev/null

